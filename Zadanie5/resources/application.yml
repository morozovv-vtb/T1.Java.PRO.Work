spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/java_db
    username: java_user
    password: java_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update   # ← ВАЖНО: было none, теперь update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false