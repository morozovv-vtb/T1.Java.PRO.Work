spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/java_db
    username: java_user
    password: java_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false  # Отключаем Flyway, т.к. мы будем использовать ddl-auto: update для разработки
    # В продакшене — включить и убрать ddl-auto